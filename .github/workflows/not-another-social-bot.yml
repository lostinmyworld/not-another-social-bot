name: Not Another Social Bot

on:
  schedule:
    - cron: '17 * * * *' # Runs at minute 17 of every hour (e.g., 1:17, 2:17)
  workflow_dispatch:

concurrency:
  group: not-another-social-bot
  cancel-in-progress: false

jobs:
  account:
    if: ${{ vars.ACCOUNTS != '' }}
    name: ${{ matrix.account }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.account }}
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(vars.ACCOUNTS) }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          source-url: https://nuget.pkg.github.com/lostinmyworld/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Not Another Social Bot
        working-directory: NotAnotherSocialBot
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_STATE_FILE_NAME: ${{ vars.GIST_STATE_FILE_NAME }}
          WATCHER_YOUTUBE_ENABLED: ${{ vars.WATCHER_YOUTUBE_ENABLED }}
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DISCORD_WEBHOOK_YOUTUBE: ${{ secrets.DISCORD_WEBHOOK_YOUTUBE }}
          WATCHER_INSTAGRAM_ENABLED: ${{ vars.WATCHER_INSTAGRAM_ENABLED }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_INSTAGRAM: ${{ secrets.DISCORD_WEBHOOK_INSTAGRAM }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PUBLISHER_DISCORD_ENABLED: ${{ vars.PUBLISHER_DISCORD_ENABLED }}
          PUBLISHER_THREADS_ENABLED: ${{ vars.PUBLISHER_THREADS_ENABLED }}
        run: dotnet run
