name: Not Another Social Bot

on:
  schedule:
    - cron: '0 * * * *' # Runs at the top of every hour (e.g., 1:00, 2:00)
  workflow_dispatch:

concurrency:
  group: not-another-social-bot
  cancel-in-progress: false

jobs:
  account:
    if: ${{ vars.ACCOUNTS != '' }}
    name: ${{ matrix.account }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(vars.ACCOUNTS) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          source-url: https://nuget.pkg.github.com/lostinmyworld/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write account settings
        env:
          ACCOUNT: ${{ matrix.account }}
          ACCOUNT_SETTINGS: ${{ secrets[format('ACCOUNT_{0}', matrix.account)] }}
        run: |
          set -euo pipefail

          if [ -z "$ACCOUNT_SETTINGS" ]; then
            echo "::error::Secret ACCOUNT_$ACCOUNT is missing."
            exit 1
          fi

          while IFS= read -r line; do
            line="${line%$'\r'}"
            value="${line#*=}"

            if [ "$value" != "$line" ] && [ -n "$value" ] && [ "$value" != "true" ] && [ "$value" != "false" ]; then
              echo "::add-mask::$value"
            fi
          done <<< "$ACCOUNT_SETTINGS"

          printf '%s\n' "$ACCOUNT_SETTINGS" > NotAnotherSocialBot/.env.local
      - name: Run Not Another Social Bot
        working-directory: NotAnotherSocialBot
        run: dotnet run
