name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 3 1,15 * *' # 03:00 UTC on the 1st and 15th of every month
  workflow_dispatch:

permissions: {}

jobs:
  account:
    if: ${{ vars.ACCOUNTS != '' }}
    name: ${{ matrix.account }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(vars.ACCOUNTS) }}
    steps:
      - name: Refresh IG_ACCESS_TOKEN and THREADS_ACCESS_TOKEN
        env:
          ACCOUNT: ${{ matrix.account }}
          ACCOUNT_SETTINGS: ${{ secrets[format('ACCOUNT_{0}', matrix.account)] }}
          GH_TOKEN: ${{ secrets.IG_TOKEN_REFRESH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$ACCOUNT_SETTINGS" ]; then
            echo "::error::Secret ACCOUNT_$ACCOUNT is missing."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret IG_TOKEN_REFRESH_PAT is missing."
            exit 1
          fi

          settings_changed=false
          refresh_failed=false

          refresh_token() {
            local key=$1
            local grant_type=$2
            local refresh_url=$3

            local current_token
            current_token=$(grep -m1 "^$key=" <<< "$ACCOUNT_SETTINGS" | cut -d= -f2- | tr -d '\r' || true)

            if [ -z "$current_token" ]; then
              echo "Skipping $key for $ACCOUNT: not set."
              return 0
            fi

            echo "::add-mask::$current_token"

            local response
            response=$(curl --silent --get \
              --data-urlencode "grant_type=$grant_type" \
              --data-urlencode "access_token=$current_token" \
              "$refresh_url")

            local new_token
            new_token=$(jq -r '.access_token // empty' <<< "$response")

            if [ -z "$new_token" ]; then
              local error_message
              error_message=$(jq -r '.error.message // "unknown error"' <<< "$response")
              echo "::error::No new $key for $ACCOUNT: $error_message"
              return 1
            fi

            echo "::add-mask::$new_token"

            ACCOUNT_SETTINGS=$(KEY="$key" NEW_TOKEN="$new_token" awk '
              index($0, ENVIRON["KEY"] "=") == 1 { print ENVIRON["KEY"] "=" ENVIRON["NEW_TOKEN"]; next }
              { print }
            ' <<< "$ACCOUNT_SETTINGS")
            settings_changed=true

            local expires_in_days
            expires_in_days=$(( $(jq -r '.expires_in // 0' <<< "$response") / 86400 ))
            echo "$key refreshed for $ACCOUNT. Valid for $expires_in_days days."
          }

          refresh_token IG_ACCESS_TOKEN ig_refresh_token "https://graph.instagram.com/refresh_access_token" || refresh_failed=true
          refresh_token THREADS_ACCESS_TOKEN th_refresh_token "https://graph.threads.com/refresh_access_token" || refresh_failed=true

          if [ "$settings_changed" = true ]; then
            printf '%s' "$ACCOUNT_SETTINGS" | gh secret set "ACCOUNT_$ACCOUNT" --repo "$REPOSITORY"
          fi

          if [ "$refresh_failed" = true ]; then
            exit 1
          fi
