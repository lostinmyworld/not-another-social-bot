name: Refresh Instagram Token

on:
  schedule:
    - cron: '0 3 1,15 * *' # 03:00 UTC on the 1st and 15th of every month
  workflow_dispatch:

permissions: {}

jobs:
  account:
    if: ${{ vars.ACCOUNTS != '' }}
    name: ${{ matrix.account }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(vars.ACCOUNTS) }}
    steps:
      - name: Refresh IG_ACCESS_TOKEN
        env:
          ACCOUNT: ${{ matrix.account }}
          ACCOUNT_SETTINGS: ${{ secrets[format('ACCOUNT_{0}', matrix.account)] }}
          GH_TOKEN: ${{ secrets.IG_TOKEN_REFRESH_PAT }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "$ACCOUNT_SETTINGS" ]; then
            echo "::error::Secret ACCOUNT_$ACCOUNT is missing."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret IG_TOKEN_REFRESH_PAT is missing."
            exit 1
          fi

          current_token=$(grep -m1 '^IG_ACCESS_TOKEN=' <<< "$ACCOUNT_SETTINGS" | cut -d= -f2- | tr -d '\r' || true)

          if [ -z "$current_token" ]; then
            echo "Skipping $ACCOUNT: no IG_ACCESS_TOKEN."
            exit 0
          fi

          echo "::add-mask::$current_token"

          response=$(curl --silent --get \
            --data-urlencode "grant_type=ig_refresh_token" \
            --data-urlencode "access_token=$current_token" \
            "https://graph.instagram.com/refresh_access_token")

          new_token=$(jq -r '.access_token // empty' <<< "$response")

          if [ -z "$new_token" ]; then
            error_message=$(jq -r '.error.message // "unknown error"' <<< "$response")
            echo "::error::Instagram did not return a new token for $ACCOUNT: $error_message"
            exit 1
          fi

          echo "::add-mask::$new_token"

          updated_settings=$(NEW_TOKEN="$new_token" awk '
            /^IG_ACCESS_TOKEN=/ { print "IG_ACCESS_TOKEN=" ENVIRON["NEW_TOKEN"]; next }
            { print }
          ' <<< "$ACCOUNT_SETTINGS")

          printf '%s' "$updated_settings" | gh secret set "ACCOUNT_$ACCOUNT" --repo "$REPOSITORY"

          expires_in_days=$(( $(jq -r '.expires_in // 0' <<< "$response") / 86400 ))
          echo "IG_ACCESS_TOKEN refreshed for $ACCOUNT. Valid for $expires_in_days days."
